
name: NYC Taxi Data Ingestion

on:

  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: nyc-taxi-ingestion
  cancel-in-progress: false

jobs:

  ingestion:

    name: NYC Taxi Data Ingestion to Azure

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run NYC Taxi Ingestion
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}

          NYC_TRIPS_DATASET_ID: "4b4i-vvec"
          NYC_ZONES_DATASET_ID: "8meu-9t5y"

          BATCH_SIZE: "25000"

        run: |
          python src/ingest.py --limit "$BATCH_SIZE"
